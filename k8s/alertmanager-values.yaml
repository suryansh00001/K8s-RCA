# Custom Helm values for Prometheus Alertmanager to integrate with K8s-RCA Agent
# Route alerts directly to our autonomous AI RCA agent webhook

replicaCount: 1

# Resource limits suitable for local dev
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Local ephemeral storage for fast dev
persistence:
  enabled: false

# Alertmanager configuration pointing to our agent's webhook
config:
  global:
    resolve_timeout: 5m
  route:
    group_by: ['alertname', 'namespace', 'pod', 'service']
    group_wait: 5s
    group_interval: 10s
    repeat_interval: 1h
    receiver: 'rca-agent'
  receivers:
  - name: 'rca-agent'
    webhook_configs:
    - url: 'http://host.docker.internal:8081/api/webhook/alertmanager'
      send_resolved: false
      http_config:
        follow_redirects: true
