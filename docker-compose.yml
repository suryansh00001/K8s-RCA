services:
  k8s-rca-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: k8s-rca-agent
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_API_KEYS=${GEMINI_API_KEYS:-}
    command: ["serve", "--port", "8080"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
    volumes:
      - ./k8s_rca:/app/k8s_rca:ro
